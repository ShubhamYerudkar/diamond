<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Price Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0e0c;
            --surface: #1a1814;
            --surface2: #211f19;
            --gold-accent: #d4a843;
            --heading: #faf6ee;
            --white: #f0ebe0;
            --muted: #a09880;
            --border: rgba(212,168,67,0.25);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background gem facet pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(135deg, rgba(212,168,67,0.05) 25%, transparent 25%),
                linear-gradient(225deg, rgba(212,168,67,0.05) 25%, transparent 25%),
                linear-gradient(315deg, rgba(212,168,67,0.05) 25%, transparent 25%),
                linear-gradient(45deg,  rgba(212,168,67,0.05) 25%, transparent 25%);
            background-size: 80px 80px;
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 80px;
        }

        /* ── HEADER ── */
        header {
            text-align: center;
            margin-bottom: 56px;
            animation: fadeDown 0.9s ease both;
        }

        .eyebrow {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold-accent);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .eyebrow::before, .eyebrow::after {
            content: '';
            width: 40px; height: 1px;
            background: var(--gold-accent);
            opacity: 0.5;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.6rem, 6vw, 4.2rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            line-height: 1.1;
            color: var(--heading);
        }
        h1 em {
            font-style: italic;
            color: var(--gold-accent);
        }

        .subtitle {
            margin-top: 16px;
            font-size: 13px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Diamond SVG icon */
        .gem-icon {
            width: 52px; height: 52px;
            margin: 0 auto 24px;
            display: block;
            filter: drop-shadow(0 0 18px rgba(212,168,67,0.5));
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 14px rgba(212,168,67,0.35)); }
            50%       { filter: drop-shadow(0 0 28px rgba(212,168,67,0.75)); }
        }

        /* ── CARD ── */
        .card {
            width: 100%;
            max-width: 740px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 52px 56px;
            animation: fadeUp 1s ease 0.2s both;
            position: relative;
            overflow: hidden;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -120px; right: -120px;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(212,168,67,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── FORM GRID ── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px 32px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group.third { grid-column: span 1; }

        .three-col {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 28px 32px;
        }

        label {
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold-accent);
            font-weight: 400;
        }

        input, select {
            background: var(--surface2);
            border: 1px solid rgba(212,168,67,0.18);
            border-radius: 2px;
            color: var(--white);
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 300;
            font-size: 15px;
            padding: 13px 16px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
        }

        input::placeholder { color: var(--muted); font-size: 13px; }

        input:focus, select:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 3px rgba(212,168,67,0.12);
        }

        /* Custom select arrow */
        .select-wrap { position: relative; }
        .select-wrap::after {
            content: '▾';
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--gold-accent);
            font-size: 13px;
            pointer-events: none;
        }
        select option { background: #1a1814; color: var(--white); }

        /* Section label */
        .section-label {
            grid-column: 1 / -1;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: -8px;
        }

        /* ── BUTTON ── */
        .btn-calc {
            grid-column: 1 / -1;
            margin-top: 12px;
            background: transparent;
            border: 1px solid rgba(212,168,67,0.6);
            color: var(--gold-accent);
            font-family: 'Josefin Sans', sans-serif;
            font-size: 12px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            padding: 18px 40px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: color 0.35s;
            border-radius: 2px;
        }

        .btn-calc::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold-accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.35s ease;
            z-index: 0;
        }

        .btn-calc:hover { color: #0f0e0c; }
        .btn-calc:hover::before { transform: scaleX(1); }
        .btn-calc span { position: relative; z-index: 1; }

        /* ── ANIMATIONS ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .card { padding: 36px 24px; }
            .form-grid { grid-template-columns: 1fr; }
            .three-col { grid-template-columns: 1fr 1fr; }
            .form-group.full, .btn-calc { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">

    <header>
        <svg class="gem-icon" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="26,4 46,18 40,46 12,46 6,18" fill="none" stroke="#d4a843" stroke-width="1.2"/>
            <polygon points="26,4 46,18 26,14" fill="rgba(212,168,67,0.25)"/>
            <polygon points="26,4 6,18 26,14" fill="rgba(212,168,67,0.18)"/>
            <polygon points="26,14 46,18 40,46 12,46 6,18" fill="rgba(212,168,67,0.12)"/>
            <line x1="26" y1="14" x2="40" y2="46" stroke="#d4a843" stroke-width="0.6" opacity="0.6"/>
            <line x1="26" y1="14" x2="12" y2="46" stroke="#d4a843" stroke-width="0.6" opacity="0.6"/>
            <line x1="26" y1="14" x2="26" y2="46" stroke="#d4a843" stroke-width="0.6" opacity="0.6"/>
            <line x1="6" y1="18" x2="46" y2="18" stroke="#d4a843" stroke-width="0.6" opacity="0.6"/>
        </svg>

        <div class="eyebrow">Precision Valuation</div>
        <h1>Diamond Price<br><em>Predictor</em></h1>
        <p class="subtitle">Enter details below to reveal the estimated value</p>
    </header>

    <div class="card">
        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <div class="form-grid">

                <div class="section-label">The 4 Cs</div>

                <div class="form-group">
                    <label for="carat">Carat Weight</label>
                    <input type="number" step="0.01" id="carat" name="carat" placeholder="e.g. 1.02" required>
                </div>

                <div class="form-group">
                    <label for="cut">Cut Quality</label>
                    <div class="select-wrap">
                        <select id="cut" name="cut">
                            <option value="Ideal">Ideal</option>
                            <option value="Premium">Premium</option>
                            <option value="Very Good">Very Good</option>
                            <option value="Good">Good</option>
                            <option value="Fair">Fair</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="color">Color Grade</label>
                    <div class="select-wrap">
                        <select id="color" name="color">
                            <option value="D">D — (Best)</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                            <option value="G">G</option>
                            <option value="H">H</option>
                            <option value="I">I</option>
                            <option value="J">J</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="clarity">Clarity</label>
                    <div class="select-wrap">
                        <select id="clarity" name="clarity">
                            <option value="IF">IF</option>
                            <option value="VVS1">VVS1</option>
                            <option value="VVS2">VVS2</option>
                            <option value="VS1">VS1</option>
                            <option value="VS2">VS2</option>
                            <option value="SI1">SI1</option>
                            <option value="SI2">SI2</option>
                            <option value="I1">I1</option>
                        </select>
                    </div>
                </div>

                <div class="section-label">Proportions &amp; Dimensions</div>

                <div class="three-col">
                    <div class="form-group">
                        <label for="depth">Depth %</label>
                        <input type="number" step="0.1" id="depth" name="depth" placeholder="61.5" required>
                    </div>
                    <div class="form-group">
                        <label for="table">Table %</label>
                        <input type="number" step="0.1" id="table" name="table" placeholder="57.0" required>
                    </div>
                    <div class="form-group">
                        <label for="x">X — Length (mm)</label>
                        <input type="number" step="0.01" id="x" name="x" placeholder="4.34" required>
                    </div>
                    <div class="form-group">
                        <label for="y">Y — Width (mm)</label>
                        <input type="number" step="0.01" id="y" name="y" placeholder="4.35" required>
                    </div>
                    <div class="form-group">
                        <label for="z">Z — Depth (mm)</label>
                        <input type="number" step="0.01" id="z" name="z" placeholder="2.75" required>
                    </div>
                </div>

                <button type="submit" class="btn-calc"><span>Calculate Estimated Price</span></button>

            </div>
        </form>
    </div>

</div>

</body>
</html>
